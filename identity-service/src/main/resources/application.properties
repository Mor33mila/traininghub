spring.application.name=identity-service
server.port=${SERVER_PORT:8080}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/traininghub_identity}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.config.import=optional:file:.env[.properties]
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:traininghub-identity}
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD}
admin.email=${ADMIN_EMAIL:admin@traininghub.local}
admin.reset-password-on-startup=${ADMIN_RESET_PASSWORD_ON_STARTUP:false}
