spring.application.name=enrollment-service
server.port=${SERVER_PORT:8083}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/traininghub_enrollments}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
course-service.base-url=${COURSE_SERVICE_URL:http://localhost:8081}
participant-service.base-url=${PARTICIPANT_SERVICE_URL:http://localhost:8082}
course-service.username=${COURSE_SERVICE_USERNAME:}
course-service.password=${COURSE_SERVICE_PASSWORD:}
participant-service.username=${PARTICIPANT_SERVICE_USERNAME:}
participant-service.password=${PARTICIPANT_SERVICE_PASSWORD:}
attendance.minimum-threshold=${ATTENDANCE_MINIMUM_THRESHOLD:80}
spring.config.import=optional:file:.env[.properties]
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:traininghub-identity}
